[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allus-company-data"
version = "0.0.16"
description = "Reference Python SDK for the allus company-data API: typed, plaintext, slug-keyed conclusions with transparent decryption."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "allme.fyi" }]
keywords = ["allus", "allme", "company-data", "sdk"]
dependencies = [
    "cryptography>=42",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/allus-fyi/company-data-python"
Repository = "https://github.com/allus-fyi/company-data-python"

# The library package lives under src/. Since #493 the example suite ships INSIDE the
# installed artifact too: `pip install` normally resolves the WHEEL, so grafting the
# examples into the sdist via MANIFEST.in alone is not enough — the top-level examples/
# tree is mapped into the package as `allus_company_data.examples` and its files ride
# along as package data. The suite stays its own runnable project; it is simply carried
# by the parent package rather than published separately.
[tool.setuptools]
packages = ["allus_company_data", "allus_company_data.examples"]

[tool.setuptools.package-dir]
"" = "src"
"allus_company_data.examples" = "examples"

[tool.setuptools.package-data]
"allus_company_data.examples" = ["**/*"]

# Keep the suite's transients out of the wheel (the sdist is pruned in MANIFEST.in).
[tool.setuptools.exclude-package-data]
"allus_company_data.examples" = [
    ".venv/**", ".runtime/**", ".frontend/**", "**/__pycache__/**", "*.frontend.download.tar.gz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
